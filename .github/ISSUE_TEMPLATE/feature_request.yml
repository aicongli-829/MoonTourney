name: Feature request
description: Propose a concrete competition workflow or reusable library capability
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Organizer or integration problem
      description: Include a small event example and the expected decision.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and rule scope
      description: Distinguish official standards from organizer policies.
    validations:
      required: true
