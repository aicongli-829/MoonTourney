name: Bug report
description: Report incorrect pairing, scoring, ranking, scheduling or web behavior
title: '[Bug]: '
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: MoonTourney version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, MoonBit version, browser or CLI
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic example
      description: Sport profile, format, entrant count, results and steps
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Link the rule source and edition if this concerns a scoring rule.
    validations:
      required: true
